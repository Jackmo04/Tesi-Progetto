apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "block-execution-from-writable-paths"
spec:
  kprobes:
  - call: "sys_execve"
    syscall: true
    args:
    - index: 0
      type: "string"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/dev/shm/"
        - "/var/tmp/"
        - "/run/"